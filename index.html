<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fitness Vibe</title>
  <style>
    /* ---------- Base / Dark Theme ---------- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1117;
      color: #e6e8ee;
      min-height: 100vh;
      padding: 1.5rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 0.4rem;
      background: linear-gradient(90deg, #4ade80, #22d3ee);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: 0.5px;
    }

    .subtitle {
      color: #8b93a7;
      font-size: 0.85rem;
      margin-bottom: 1.5rem;
    }

    /* ---------- Layout ---------- */
    .timers {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1rem;
      width: 100%;
      max-width: 720px;
    }

    .card {
      background: #1a1d29;
      border: 1px solid #262b3a;
      border-radius: 16px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .card h2 {
      font-size: 1.1rem;
      font-weight: 600;
    }

    /* ---------- Timer Display ---------- */
    .time {
      font-size: 2.6rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      text-align: center;
      color: #4ade80;
      letter-spacing: 1px;
      padding: 0.4rem 0;
      background: #12141d;
      border-radius: 10px;
    }

    .card.running .time {
      color: #22d3ee;
    }

    /* ---------- Buttons ---------- */
    .controls {
      display: flex;
      gap: 0.75rem;
    }

    button {
      flex: 1;
      min-height: 48px;
      padding: 0.75rem 0.75rem;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s ease, transform 0.1s ease;
    }

    button:active {
      transform: scale(0.97);
    }

    .btn-start {
      background: #22c55e;
      color: #06210f;
    }

    .btn-stop {
      background: #ef4444;
      color: #fff;
    }

    .btn-reset {
      background: #3a3f52;
      color: #e6e8ee;
    }

    .btn-save {
      background: #6366f1;
      color: #fff;
      flex: 1;
      padding: 0.8rem;
      font-size: 1rem;
    }

    /* ---------- Save Area ---------- */
    .save-area {
      width: 100%;
      max-width: 720px;
      margin-top: 1.25rem;
      display: flex;
      gap: 0.75rem;
    }

    .save-area button {
      flex: 1;
    }

    /* ---------- Past Sessions ---------- */
    .sessions {
      width: 100%;
      max-width: 720px;
      margin-top: 2rem;
    }

    .sessions h2 {
      font-size: 1.15rem;
      margin-bottom: 0.75rem;
    }

    #sessionList {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .session-item {
      background: #1a1d29;
      border: 1px solid #262b3a;
      border-left: 4px solid #22d3ee;
      border-radius: 10px;
      padding: 0.75rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .session-item .name {
      font-weight: 600;
    }

    .session-item .date {
      color: #8b93a7;
      font-size: 0.75rem;
      margin-top: 2px;
    }

    .session-item .duration {
      font-weight: 700;
      color: #4ade80;
      white-space: nowrap;
    }

    .empty {
      color: #8b93a7;
      font-style: italic;
      text-align: center;
      padding: 1rem;
      border: 1px dashed #262b3a;
      border-radius: 10px;
    }

    /* ---------- Toast ---------- */
    #toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #22c55e;
      color: #06210f;
      font-weight: 600;
      padding: 0.7rem 1.4rem;
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <h1>Fitness Vibe</h1>
  <p class="subtitle">Track your plank &amp; wall-sit sessions</p>

  <!-- Timer cards -->
  <div class="timers">
    <div class="card" id="plankCard">
      <h2>Plank</h2>
      <div class="time" id="plankTime">00:00.0</div>
      <div class="controls">
        <button class="btn-start" id="plankStart">Start</button>
        <button class="btn-stop" id="plankStop">Stop</button>
        <button class="btn-reset" id="plankReset">Reset</button>
      </div>
    </div>

    <div class="card" id="wallSitCard">
      <h2>Wall-Sit</h2>
      <div class="time" id="wallSitTime">00:00.0</div>
      <div class="controls">
        <button class="btn-start" id="wallSitStart">Start</button>
        <button class="btn-stop" id="wallSitStop">Stop</button>
        <button class="btn-reset" id="wallSitReset">Reset</button>
      </div>
    </div>
  </div>

  <!-- Save the last stopped session -->
  <div class="save-area">
    <button class="btn-save" id="saveBtn">Save Session</button>
  </div>

  <!-- Past sessions loaded from localStorage -->
  <section class="sessions">
    <h2>Past Sessions</h2>
    <ul id="sessionList"></ul>
  </section>

  <div id="toast">Saved!</div>

  <script>
    /* =========================================================
       Configuration
       ========================================================= */
    const STORAGE_KEY = 'fitnessVibe.sessions';

    // Each timer tracks accumulated time (in ms) and an optional
    // start timestamp while running, so stop/start preserves duration.
    const timers = {
      plank: {
        name: 'Plank',
        accumulated: 0,
        startTime: null,
        intervalId: null,
        card: document.getElementById('plankCard'),
        timeEl: document.getElementById('plankTime'),
        startBtn: document.getElementById('plankStart'),
        stopBtn: document.getElementById('plankStop'),
        resetBtn: document.getElementById('plankReset')
      },
      wallSit: {
        name: 'Wall-Sit',
        accumulated: 0,
        startTime: null,
        intervalId: null,
        card: document.getElementById('wallSitCard'),
        timeEl: document.getElementById('wallSitTime'),
        startBtn: document.getElementById('wallSitStart'),
        stopBtn: document.getElementById('wallSitStop'),
        resetBtn: document.getElementById('wallSitReset')
      }
    };

    // Remember which exercise was last stopped, for the Save button.
    let lastStoppedKey = null;

    /* =========================================================
       Helpers
       ========================================================= */

    // Format milliseconds as MM:SS.t
    function formatTime(ms) {
      const totalSeconds = ms / 1000;
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = Math.floor(totalSeconds % 60);
      const tenths = Math.floor((ms % 1000) / 100);
      return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}.${tenths}`;
    }

    // Read sessions from localStorage (returns array).
    // Handles missing key, invalid JSON, non-array data, and
    // malformed entries so the page never breaks on bad data.
    function loadSessions() {
      try {
        const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (!Array.isArray(data)) return [];
        return data.filter(s =>
          s &&
          typeof s.exercise === 'string' &&
          typeof s.durationMs === 'number' &&
          typeof s.date === 'string'
        );
      } catch (e) {
        return [];
      }
    }

    // Write sessions to localStorage (guard against quota errors).
    function saveSessions(sessions) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions));
      } catch (e) {
        showToast('Could not save — storage unavailable.');
      }
    }

    // Show a brief toast notification.
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    /* =========================================================
       Timer logic
       ========================================================= */

    function currentElapsed(t) {
      // If running, add the live stretch to accumulated time.
      return t.accumulated + (t.startTime !== null ? Date.now() - t.startTime : 0);
    }

    function renderTimer(t) {
      t.timeEl.textContent = formatTime(currentElapsed(t));
    }

    function startTimer(key) {
      const t = timers[key];
      if (t.startTime !== null) return; // already running
      t.startTime = Date.now();
      t.intervalId = setInterval(() => renderTimer(t), 100);
      t.card.classList.add('running');
      t.startBtn.disabled = true;
      t.stopBtn.disabled = false;
      t.resetBtn.disabled = false;
    }

    function stopTimer(key) {
      const t = timers[key];
      if (t.startTime === null) return; // already stopped
      t.accumulated += Date.now() - t.startTime;
      t.startTime = null;
      clearInterval(t.intervalId);
      t.intervalId = null;
      t.card.classList.remove('running');
      t.startBtn.disabled = false;
      t.stopBtn.disabled = true;
      renderTimer(t);
      lastStoppedKey = key;
    }

    function resetTimer(key) {
      const t = timers[key];
      if (t.startTime !== null) stopTimer(key);
      t.accumulated = 0;
      t.startTime = null;
      clearInterval(t.intervalId);
      t.intervalId = null;
      t.card.classList.remove('running');
      t.startBtn.disabled = false;
      t.stopBtn.disabled = true;
      t.resetBtn.disabled = false;
      renderTimer(t);
    }

    // Wire up the three buttons for each timer.
    Object.keys(timers).forEach(key => {
      const t = timers[key];
      t.startBtn.addEventListener('click', () => startTimer(key));
      t.stopBtn.addEventListener('click', () => stopTimer(key));
      t.resetBtn.addEventListener('click', () => resetTimer(key));
      // Initial state: stopped, buttons reflect that.
      t.stopBtn.disabled = true;
      renderTimer(t);
    });

    /* =========================================================
       Saving sessions
       ========================================================= */

    document.getElementById('saveBtn').addEventListener('click', () => {
      if (!lastStoppedKey) {
        showToast('Stop a timer first!');
        return;
      }
      const t = timers[lastStoppedKey];
      const durationMs = currentElapsed(t);

      // Ignore saves with zero duration.
      if (durationMs <= 0) {
        showToast('Nothing to save yet.');
        return;
      }

      const session = {
        exercise: t.name,
        durationMs: Math.round(durationMs),
        date: new Date().toISOString()
      };

      const sessions = loadSessions();
      sessions.unshift(session); // newest first
      saveSessions(sessions);
      renderSessions();

      // Clear the saved timer so it can be reused.
      resetTimer(lastStoppedKey);
      showToast(`${t.name} session saved!`);
    });

    /* =========================================================
       Past sessions list
       ========================================================= */

    function formatDate(isoString) {
      const d = new Date(isoString);
      return d.toLocaleDateString(undefined, {
        month: 'short', day: 'numeric', year: 'numeric'
      }) + ' · ' + d.toLocaleTimeString(undefined, {
        hour: 'numeric', minute: '2-digit'
      });
    }

    function renderSessions() {
      const list = document.getElementById('sessionList');
      const sessions = loadSessions();
      list.innerHTML = '';

      if (sessions.length === 0) {
        const li = document.createElement('li');
        li.className = 'empty';
        li.textContent = 'No sessions yet — go do a plank!';
        list.appendChild(li);
        return;
      }

      sessions.forEach(session => {
        const li = document.createElement('li');
        li.className = 'session-item';

        const info = document.createElement('div');
        const name = document.createElement('div');
        name.className = 'name';
        name.textContent = session.exercise;
        const date = document.createElement('div');
        date.className = 'date';
        date.textContent = formatDate(session.date);
        info.appendChild(name);
        info.appendChild(date);

        const duration = document.createElement('div');
        duration.className = 'duration';
        duration.textContent = formatTime(session.durationMs).replace(/\.\d$/, '');

        li.appendChild(info);
        li.appendChild(duration);
        list.appendChild(li);
      });
    }

    // Load saved sessions on page open.
    renderSessions();
  </script>
</body>
</html>
